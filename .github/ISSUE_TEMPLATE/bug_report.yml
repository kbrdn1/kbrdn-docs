name: '🐛 Bug report'
description: 'Un problème sur un site de documentation (rendu, lien mort, contenu erroné)'
title: '[Bug]: '
labels: ['fix']
assignees: []

body:
  - type: dropdown
    id: site
    attributes:
      label: Site concerné
      options:
        - gwm
        - design system partagé (ds-shared)
        - infra / CI / déploiement
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: Description
      description: Que se passe-t-il ? Quel est le comportement attendu ?
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL / page
      description: Lien vers la page concernée, si applicable.

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      placeholder: |
        1. Aller sur …
        2. Cliquer sur …
        3. Observer …

  - type: textarea
    id: env
    attributes:
      label: Environnement
      placeholder: navigateur, OS, version…
    validations:
      required: false
