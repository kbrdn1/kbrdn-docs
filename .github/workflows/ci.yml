name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: oxlint + prettier + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: oxlint
        run: bun run lint
      - name: prettier --check
        run: bun run format:check
      # Le noyau de conversion (`scripts/lib/convert.mjs`) est lancé sans relecture
      # humaine : `sync-gwm.yml` le déclenche sur un `repository_dispatch`, commite
      # ce qu'il produit et déploie. Une régression de mapping se publierait donc
      # seule, d'où ce gate.
      - name: bun test
        run: bun test

  build:
    name: astro check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: astro check (all sites)
        run: bun --filter='*' run check
      - name: build (all sites)
        run: bun run build
      - name: upload gwm build
        uses: actions/upload-artifact@v7
        with:
          name: docs-gwm
          path: sites/gwm/dist
          if-no-files-found: error
