name: deploy

# Versioning par branche : `main` déploie le déploiement de production ("latest").
# Les branches de version (ex: release/gwm/v0.9) déploient des déploiements
# Cloudflare Pages séparés via le même job (paramètre `--branch`). Voir PLAN.md.
#
# Prérequis (une fois) :
#   - secrets : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   - variable repo : DEPLOY_ENABLED = "true"  (garde anti-échec avant setup)
#   - projet Cloudflare Pages : "gwm-docs"

on:
  push:
    branches: [main]
    paths:
      - 'sites/gwm/**'
      - 'packages/ds-shared/**'
      - 'bun.lock'
  workflow_dispatch:

jobs:
  deploy-gwm:
    name: gwm → Cloudflare Pages
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      # Historique complet : le `lastmod` du sitemap est la date du dernier
      # commit touchant chaque page. Sur le clone superficiel par défaut, il n'y
      # a qu'un commit et le site sort sans aucun `lastmod` (garde volontaire
      # dans `src/lib/sitemap-lastmod.mjs`, plutôt qu'une date uniforme fausse).
      # `ci.yml` reste en profondeur 1 : son build est une vérification, il ne
      # publie rien.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: build gwm
        run: bun --filter='@kbrdn/docs-gwm' run build
      - name: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sites/gwm/dist --project-name=gwm-docs --branch=${{ github.ref_name }}
