version: 2
updates:
  - package-ecosystem: 'npm'
    # `/` seul : l'entrée racine résout déjà les workspaces bun, donc lister
    # aussi les packages sortait chaque bump en double (cf. #36 / #37).
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'chore'
    commit-message:
      prefix: '⬆️ chore(deps)'
      include: 'scope'
    ignore:
      # TypeScript 7 (port natif) casse `astro check` : @astrojs/language-server
      # plante sur `AstroCheck.getTsconfig` → `Cannot read properties of
      # undefined (reading 'fileExists')`. À retirer quand le language-server
      # supportera l'API TS 7 (cf. #39).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      astro-stack:
        patterns:
          - 'astro'
          - '@astrojs/*'
      starlight:
        patterns:
          - 'starlight-*'
      tooling:
        patterns:
          - 'oxlint'
          - 'prettier*'
          - 'typescript'

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'monthly'
    labels:
      - 'ci'
      - 'dependencies'
    commit-message:
      prefix: '⬆️ ci(actions)'
      include: 'scope'
