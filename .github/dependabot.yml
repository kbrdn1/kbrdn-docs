version: 2
updates:
  - package-ecosystem: 'npm'
    # `/` seul : l'entrée racine résout déjà les workspaces bun, donc lister
    # aussi les packages sortait chaque bump en double (cf. #36 / #37).
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'chore'
    commit-message:
      prefix: '⬆️ chore(deps)'
      include: 'scope'
    ignore:
      # TypeScript 7 (compilateur natif) n'expose pas l'API programmatique dont
      # `astro check` dépend — @astrojs/language-server ≥ 2.16.13 le détecte et
      # refuse de démarrer : « TypeScript's native compiler (7.0 and later) does
      # not ship this API yet ». Suivi : withastro/roadmap#1321.
      #
      # Borné à `>=7`, et pas à toutes les majeures : 6.x fournit encore l'API
      # (le message d'erreur le dit lui-même), donc l'ignorer en bloc nous
      # aurait coupés de la majeure qu'on peut prendre — et de la prochaine.
      - dependency-name: 'typescript'
        versions: ['>=7']
    groups:
      astro-stack:
        patterns:
          - 'astro'
          - '@astrojs/*'
      starlight:
        patterns:
          - 'starlight-*'
      tooling:
        patterns:
          - 'oxlint'
          - 'prettier*'
          - 'typescript'

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'monthly'
    labels:
      - 'ci'
      - 'dependencies'
    commit-message:
      prefix: '⬆️ ci(actions)'
      include: 'scope'
